<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>量化資產 Telegram Mini App</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Chart.js & Zoom Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 12px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .title {
      font-size: 16px;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }
    .tab-btn {
      flex: 1;
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 8px 0;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: #38bdf8;
      color: #0f172a;
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }
    .tf-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      background: #1e293b;
      padding: 4px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .tf-btn {
      flex: 1;
      background: transparent;
      color: #94a3b8;
      border: none;
      padding: 6px 0;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
    }
    .tf-btn.active {
      background: #334155;
      color: #f8fafc;
    }
    .chart-card {
      flex: 1;
      background: #1e293b;
      border-radius: 12px;
      border: 1px solid #334155;
      padding: 10px;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .chart-container {
      position: relative;
      flex: 1;
      width: 100%;
    }
    .stat-row {
      display: flex;
      justify-content: space-around;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #334155;
      font-size: 12px;
    }
    .stat-item {
      text-align: center;
    }
    .stat-label {
      color: #64748b;
      font-size: 10px;
      margin-bottom: 2px;
    }
    .stat-val {
      font-weight: 700;
      color: #f8fafc;
    }
    .hint {
      text-align: center;
      font-size: 10px;
      color: #64748b;
      margin-top: 6px;
    }
    .loading-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #38bdf8;
      font-size: 13px;
      font-weight: 600;
      border-radius: 12px;
      z-index: 10;
      transition: opacity 0.3s ease;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="title">
      ⚡ 試算表連線 Mini App
    </div>
    <div class="badge" id="live-status">資料同步中</div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTarget('skhy')">海力士溢價</button>
    <button class="tab-btn" onclick="switchTarget('oil')">原油價差</button>
    <button class="tab-btn" onclick="switchTarget('metal')">金銀比值</button>
  </div>

  <div class="tf-row">
    <button class="tf-btn active" onclick="switchTimeframe('1m')">1M 即時</button>
    <button class="tf-btn" onclick="switchTimeframe('5m')">5M 趨勢</button>
    <button class="tf-btn" onclick="switchTimeframe('1h')">1H K線</button>
    <button class="tf-btn" onclick="resetZoom()">🔍 重置縮放</button>
  </div>

  <div class="chart-card">
    <div id="loading" class="loading-overlay">正在讀取 Google 試算表真實數據...</div>
    <div class="chart-container">
      <canvas id="myChart"></canvas>
    </div>

    <div class="stat-row">
      <div class="stat-item">
        <div class="stat-label">最新試算表指標</div>
        <div class="stat-val" id="val-current">--</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">歷史最高點</div>
        <div class="stat-val" id="val-max">--</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">歷史最低點</div>
        <div class="stat-val" id="val-min">--</div>
      </div>
    </div>
  </div>

  <div class="hint">📊 數據源：Google 試算表「獨立欄位數據庫」 | 雙指縮放與拖曳</div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
      window.Telegram.WebApp.setHeaderColor('#0f172a');
      window.Telegram.WebApp.setBackgroundColor('#0f172a');
    }

    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTAD_G7gmUBWBOIibkcg-qDZmHaVdYhTW3Ly1e65f-EmYg62A5R4OHZoqyEHb4Cpqr/exec";
    
    let rawSheetData = [];
    let currentTarget = 'skhy';
    let currentTimeframe = '1m';
    let myChart = null;

    async function loadSheetData() {
      const loader = document.getElementById('loading');
      loader.style.opacity = '1';
      loader.style.display = 'flex';

      try {
        const response = await fetch(APPS_SCRIPT_URL + "?action=getData");
        const json = await response.json();
        
        if (json && json.data && json.data.length > 0) {
          rawSheetData = json.data;
          document.getElementById('live-status').innerText = "連線成功 (" + rawSheetData.length + "筆)";
        }
      } catch (err) {
        console.error("載入試算表失敗: ", err);
        document.getElementById('live-status').innerText = "讀取預設模型";
      } finally {
        loader.style.opacity = '0';
        setTimeout(() => { loader.style.display = 'none'; }, 300);
        renderChart();
      }
    }

    function processData(target, tf) {
      if (!rawSheetData || rawSheetData.length === 0) {
        return generateFallbackData(target, tf);
      }

      let step = 1;
      let limit = 30;

      if (tf === '5m') { limit = 150; step = 5; }
      else if (tf === '1h') { limit = 1440; step = 60; }

      const sliced = rawSheetData.slice(-limit);
      const labels = [];
      const data = [];

      for (let i = 0; i < sliced.length; i += step) {
        const item = sliced[i];
        labels.push(item.time);
        
        if (target === 'skhy') data.push(parseFloat(item.skhy));
        else if (target === 'oil') data.push(parseFloat(item.oil));
        else if (target === 'metal') data.push(parseFloat(item.metal));
      }

      return { labels, data };
    }

    function generateFallbackData(target, tf) {
      const count = tf === '1m' ? 30 : (tf === '5m' ? 60 : 120);
      const labels = [];
      const data = [];
      const now = new Date();
      let baseVal = target === 'skhy' ? 35.2 : (target === 'oil' ? 3.24 : 69.5);

      for (let i = count; i >= 0; i--) {
        const d = new Date(now.getTime() - i * 60000);
        labels.push(String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'));
        baseVal += (Math.random() - 0.48) * 0.2;
        data.push(parseFloat(baseVal.toFixed(2)));
      }
      return { labels, data };
    }

    function renderChart() {
      const ctx = document.getElementById('myChart').getContext('2d');
      const processed = processData(currentTarget, currentTimeframe);

      if (!myChart) {
        myChart = new Chart(ctx, {
          type: 'line',
          data: {
            labels: processed.labels,
            datasets: [{
              label: getTitle(currentTarget),
              data: processed.data,
              borderColor: '#38bdf8',
              backgroundColor: 'rgba(56, 189, 248, 0.12)',
              fill: true,
              borderWidth: 2.5,
              pointRadius: 3,
              tension: 0.2
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              zoom: {
                pan: { enabled: true, mode: 'x' },
                zoom: { wheel: { enabled: true }, pinch: { enabled: true }, mode: 'x' }
              }
            },
            scales: {
              x: { ticks: { color: '#64748b', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.05)' } },
              y: { ticks: { color: '#94a3af', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.08)' } }
            }
          }
        });
      } else {
        myChart.data.labels = processed.labels;
        myChart.data.datasets[0].label = getTitle(currentTarget);
        myChart.data.datasets[0].data = processed.data;
        myChart.resetZoom();
        myChart.update();
      }

      updateStatsInfo(processed.data);
    }

    function getTitle(target) {
      if (target === 'skhy') return 'SK海力士 溢價率 (%)';
      if (target === 'oil') return '原油 BZ-CL 價差 (USD)';
      return '貴金屬 金銀比 (XAU/XAG)';
    }

    function updateStatsInfo(arr) {
      if (!arr || arr.length === 0) return;
      const last = arr[arr.length - 1];
      const max = Math.max(...arr);
      const min = Math.min(...arr);

      let unit = '%';
      if (currentTarget === 'oil') unit = ' USD';
      else if (currentTarget === 'metal') unit = 'x';

      document.getElementById('val-current').innerText = (last >= 0 ? '+' : '') + last + unit;
      document.getElementById('val-max').innerText = (max >= 0 ? '+' : '') + max + unit;
      document.getElementById('val-min').innerText = (min >= 0 ? '+' : '') + min + unit;
    }

    function switchTarget(target) {
      currentTarget = target;
      document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', (idx === 0 && target === 'skhy') || (idx === 1 && target === 'oil') || (idx === 2 && target === 'metal'));
      });
      renderChart();
    }

    function switchTimeframe(tf) {
      currentTimeframe = tf;
      document.querySelectorAll('.tf-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', (idx === 0 && tf === '1m') || (idx === 1 && tf === '5m') || (idx === 2 && tf === '1h'));
      });
      renderChart();
    }

    function resetZoom() {
      if (myChart) myChart.resetZoom();
    }

    window.onload = () => {
      loadSheetData();
    };
  </script>
</body>
</html>

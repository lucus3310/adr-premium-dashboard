<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>量化資產 Telegram Mini App</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Chart.js & Zoom Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #0d1117;
      color: #d1d4dc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      padding: 8px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 6px 8px 6px;
      border-bottom: 1px solid #161b22;
    }
    .symbol-title {
      font-size: 15px;
      font-weight: 700;
      color: #58a6ff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge-status {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #161b22;
      color: #8b949e;
      border: 1px solid #30363d;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .badge-status.active {
      color: #3fb950;
      border-color: rgba(63, 185, 80, 0.4);
      background: rgba(63, 185, 80, 0.1);
    }
    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #3fb950;
      box-shadow: 0 0 6px #3fb950;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }
    .range-selector {
      display: flex;
      gap: 4px;
      background: #161b22;
      padding: 3px;
      border-radius: 6px;
      margin: 8px 0;
      border: 1px solid #21262d;
      overflow-x: auto;
      white-space: nowrap;
    }
    .range-btn {
      flex: 1;
      background: transparent;
      color: #8b949e;
      border: none;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      text-align: center;
    }
    .range-btn.active {
      background: #21262d;
      color: #58a6ff;
      box-shadow: inset 0 0 0 1px #30363d;
    }
    .asset-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .asset-btn {
      flex: 1;
      background: #161b22;
      color: #8b949e;
      border: 1px solid #30363d;
      padding: 6px 0;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
    }
    .asset-btn.active {
      background: #238636;
      color: #ffffff;
      border-color: #2ea043;
      box-shadow: 0 0 10px rgba(46, 160, 67, 0.4);
    }
    .chart-card {
      flex: 1;
      background: #0d1117;
      border-radius: 8px;
      border: 1px solid #21262d;
      padding: 6px;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .chart-container {
      position: relative;
      flex: 1;
      width: 100%;
      touch-action: none;
    }
    .price-panel {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 4px 8px;
      background: #161b22;
      border-radius: 6px;
      margin-bottom: 6px;
      border: 1px solid #21262d;
    }
    .price-main {
      font-size: 18px;
      font-weight: 800;
      font-family: monospace;
    }
    .price-main.up { color: #3fb950; }
    .price-main.down { color: #f85149; }
    .price-sub-info {
      font-size: 11px;
      color: #8b949e;
      display: flex;
      gap: 12px;
    }
    .error-banner {
      display: none;
      background: rgba(248, 81, 73, 0.15);
      border: 1px solid rgba(248, 81, 73, 0.4);
      color: #ff7b72;
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      text-align: center;
      margin-bottom: 8px;
    }
    .loading-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(13, 17, 23, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #58a6ff;
      font-size: 12px;
      font-weight: 600;
      border-radius: 8px;
      z-index: 10;
      transition: opacity 0.3s ease;
    }
    .footer-hint {
      text-align: center;
      font-size: 10px;
      color: #484f58;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="symbol-title" id="chart-title">
      📈 SK海力士 折溢價率
    </div>
    <div class="badge-status active" id="live-status">
      <div class="pulse-dot"></div>
      <span id="status-text">15s 即時動態連線</span>
    </div>
  </div>

  <div id="error-box" class="error-banner"></div>

  <div class="asset-tabs">
    <button class="asset-btn active" onclick="switchTarget('skhy')">海力士溢價</button>
    <button class="asset-btn" onclick="switchTarget('oil')">原油價差</button>
    <button class="asset-btn" onclick="switchTarget('metal')">金銀比值</button>
  </div>

  <div class="range-selector">
    <button class="range-btn" onclick="switchRange('1d')">分時 1日</button>
    <button class="range-btn active" onclick="switchRange('5d')">多日 5日</button>
    <button class="range-btn" onclick="switchRange('1m')">全景 1月</button>
    <button class="range-btn" onclick="resetZoom()">🔍 重置縮放</button>
  </div>

  <div class="price-panel">
    <div class="price-main up" id="val-current">--</div>
    <div class="price-sub-info">
      <div>最高 <span id="val-max" style="color:#3fb950">--</span></div>
      <div>最低 <span id="val-min" style="color:#f85149">--</span></div>
    </div>
  </div>

  <div class="chart-card">
    <div id="loading" class="loading-overlay">正在讀取多日跨度歷史數據...</div>
    <div class="chart-container">
      <canvas id="myChart"></canvas>
    </div>
  </div>

  <div class="footer-hint">🟢 完美解析 MM-dd HH:mm 實時時間 | 跨日標記 7/29 | 15s 動態連線</div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
      window.Telegram.WebApp.setHeaderColor('#0d1117');
      window.Telegram.WebApp.setBackgroundColor('#0d1117');
    }

    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTAD_G7gmUBWBOIibkcg-qDZmHaVdYhTW3Ly1e65f-EmYg62A5R4OHZoqyEHb4Cpqr/exec";
    
    let rawSheetData = [];
    let currentTarget = 'skhy';
    let currentRange = '5d';
    let myChart = null;
    let refreshTimer = null;
    let lastHoveredIndex = -1;
    let activeTouchX = null;
    let activeTouchY = null;
    let processedDataStore = { labels: [], data: [], parsedTimes: [] };

    // 📳 輕量化非阻塞震動
    function triggerHapticFeedbackAsync() {
      setTimeout(() => {
        try {
          if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
            window.Telegram.WebApp.HapticFeedback.selectionChanged();
          } else if (navigator.vibrate) {
            navigator.vibrate(6);
          }
        } catch (e) {}
      }, 0);
    }

    // 🕐 解析時間字串 (完全相容 "07-29 12:20", "2026-07-29 12:20:00", "ul 29 2026 12:20")
    function parseTimeStr(rawStr) {
      if (!rawStr) return { date: "", time: "--:--" };
      let str = rawStr.toString().trim();
      let cleanStr = str.replace(/^ul\s+/i, 'Jul ');

      // 1. 先嘗試匹配標準格式 "MM-dd HH:mm" 或 "MM/dd HH:mm"
      const m1 = str.match(/(\d{1,2})[-/](\d{1,2})\s+(\d{1,2}):(\d{2})/);
      if (m1) {
        return {
          date: `${parseInt(m1[1], 10)}/${parseInt(m1[2], 10)}`,
          time: `${parseInt(m1[3], 10)}:${m1[4]}`
        };
      }

      // 2. 嘗試 JS 標準 Date 解析
      let d = new Date(cleanStr);
      if (!isNaN(d.getTime())) {
        const month = d.getMonth() + 1;
        const day = d.getDate();
        const hour = d.getHours();
        const minute = (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
        return {
          date: `${month}/${day}`,
          time: `${hour}:${minute}`
        };
      }

      return { date: "", time: str };
    }

    // 🎯 60 FPS 無框極簡純文字 Crosshair Plugin
    const okxCrosshairPlugin = {
      id: 'okxCrosshair',
      afterDatasetsDraw: (chart) => {
        if (activeTouchX !== null && lastHoveredIndex !== -1 && processedDataStore.parsedTimes[lastHoveredIndex]) {
          const topY = chart.scales.y.top;
          const bottomY = chart.scales.y.bottom;
          const ctx = chart.ctx;

          ctx.save();
          
          // 1. 繪製垂直貫穿虛線
          ctx.beginPath();
          ctx.setLineDash([4, 4]);
          ctx.moveTo(activeTouchX, topY);
          ctx.lineTo(activeTouchX, bottomY);
          ctx.lineWidth = 1.2;
          ctx.strokeStyle = 'rgba(88, 166, 255, 0.85)';
          ctx.stroke();

          // 2. 繪製無背景框純文字標籤
          const parsed = processedDataStore.parsedTimes[lastHoveredIndex];
          const timeLabel = parsed.time; // 例如 "12:20" 或 "2:10"
          const rawVal = chart.data.datasets[0].data[lastHoveredIndex];
          
          let unit = '%';
          if (currentTarget === 'oil') unit = ' USD';
          else if (currentTarget === 'metal') unit = 'x';

          const valLabel = (rawVal >= 0 ? '+' : '') + rawVal + unit;

          ctx.setLineDash([]);
          ctx.font = '10px monospace';
          
          const isRightSide = activeTouchX > chart.width - 80;
          const textX = isRightSide ? activeTouchX - 6 : activeTouchX + 6;
          ctx.textAlign = isRightSide ? 'right' : 'left';

          // 數值文字 (亮霓虹綠)
          ctx.fillStyle = '#3fb950';
          const yPos = activeTouchY ? Math.max(topY + 14, Math.min(bottomY - 14, activeTouchY)) : topY + 16;
          ctx.fillText(valLabel, textX, yPos);

          // 時間文字 (例如 "12:20"，青藍色)
          ctx.fillStyle = '#58a6ff';
          ctx.fillText(timeLabel, textX, bottomY - 6);

          ctx.restore();
        }
      }
    };

    Chart.register(okxCrosshairPlugin);

    async function loadData(isSilent = false) {
      const loader = document.getElementById('loading');
      const errorBox = document.getElementById('error-box');
      const statusText = document.getElementById('status-text');
      
      if (!isSilent) {
        loader.style.opacity = '1';
        loader.style.display = 'flex';
      }
      errorBox.style.display = 'none';

      try {
        const res = await fetch(APPS_SCRIPT_URL + "?action=getData&limit=43200");
        const json = await res.json();

        if (json && json.status === "success" && json.data && json.data.length > 0) {
          rawSheetData = json.data;
          statusText.innerText = "15s 即時動態 (" + rawSheetData.length + "筆)";
          renderChart(isSilent);
        } else {
          if (!isSilent) showError("⚠️ 數據庫尚無資料，請先在 Apps Script 執行歷史寫入。");
        }
      } catch (err) {
        if (!isSilent) showError("⚠️ 連線失敗: " + err.message);
      } finally {
        if (!isSilent) {
          loader.style.opacity = '0';
          setTimeout(() => { loader.style.display = 'none'; }, 200);
        }
      }
    }

    function showError(msg) {
      const errorBox = document.getElementById('error-box');
      const statusText = document.getElementById('status-text');
      statusText.innerText = "讀取失敗";
      errorBox.innerHTML = msg;
      errorBox.style.display = 'block';
    }

    function processData(target, range) {
      if (!rawSheetData || rawSheetData.length === 0) return { labels: [], data: [], maxData: [], minData: [], parsedTimes: [] };

      let limit = 1440;
      let step = 1;

      if (range === '1d') { limit = 1440; step = 1; }
      else if (range === '5d') { limit = 7200; step = 6; }
      else if (range === '1m') { limit = 43200; step = 15; }

      const sliced = rawSheetData.slice(-limit);
      const labels = [];
      const data = [];
      const maxData = [];
      const minData = [];
      const parsedTimes = [];

      for (let i = 0; i < sliced.length; i += step) {
        const windowItems = sliced.slice(i, i + step);
        if (windowItems.length === 0) continue;

        let vals = [];
        for (let item of windowItems) {
          let v = 0;
          if (target === 'skhy') {
            v = parseFloat(item.skhy);
            if (v > 0 && v < 1.0) v = parseFloat((v * 100).toFixed(2));
          }
          else if (target === 'oil') v = parseFloat(item.oil);
          else if (target === 'metal') v = parseFloat(item.metal);

          if (!isNaN(v) && v !== 0) vals.push(v);
        }

        if (vals.length === 0) continue;

        const closeVal = vals[vals.length - 1];
        const maxVal = Math.max(...vals);
        const minVal = Math.min(...vals);
        const lastItem = windowItems[windowItems.length - 1];

        labels.push(lastItem.time);
        data.push(closeVal);
        maxData.push(maxVal);
        minData.push(minVal);
        parsedTimes.push(parseTimeStr(lastItem.time));
      }

      processedDataStore = { labels, data, maxData, minData, parsedTimes };
      return processedDataStore;
    }

    let touchRaf = null;

    function setupDirectTouchListeners(canvas) {
      const handleTouch = (e) => {
        if (!myChart) return;

        // 🖐️ 雙指以上觸控 (Pinch Zoom)：自動暫停單指十字線，專心進行雙指放大縮小！
        if (e.touches && e.touches.length >= 2) {
          activeTouchX = null;
          activeTouchY = null;
          lastHoveredIndex = -1;
          myChart.setActiveElements([]);
          myChart.update('none');
          return;
        }
        
        if (touchRaf) return;
        touchRaf = requestAnimationFrame(() => {
          touchRaf = null;
          const rect = canvas.getBoundingClientRect();
          const touch = e.touches ? e.touches[0] : e;
          if (!touch) return;

          const elements = myChart.getElementsAtEventForMode(
            e, 'index', { intersect: false }, false
          );

          if (elements && elements.length > 0) {
            const idx = elements[0].index;
            activeTouchX = elements[0].element.x;
            activeTouchY = elements[0].element.y;

            if (idx !== lastHoveredIndex) {
              lastHoveredIndex = idx;
              triggerHapticFeedbackAsync();
            }
            myChart.setActiveElements([{ datasetIndex: 0, index: idx }]);
            myChart.update('none');
          }
        });
      };

      const handleTouchEnd = () => {
        if (touchRaf) {
          cancelAnimationFrame(touchRaf);
          touchRaf = null;
        }
        activeTouchX = null;
        activeTouchY = null;
        lastHoveredIndex = -1;
        if (myChart) {
          myChart.setActiveElements([]);
          myChart.update('none');
        }
      };

      canvas.addEventListener('touchstart', handleTouch, { passive: true });
      canvas.addEventListener('touchmove', handleTouch, { passive: true });
      canvas.addEventListener('touchend', handleTouchEnd, { passive: true });
      canvas.addEventListener('mousemove', handleTouch);
      canvas.addEventListener('mouseleave', handleTouchEnd);
    }

    function renderChart(isSilent = false, animate = false) {
      const canvas = document.getElementById('myChart');
      const ctx = canvas.getContext('2d');
      const processed = processData(currentTarget, currentRange);

      if (processed.data.length === 0) return;

      const gradientGreen = ctx.createLinearGradient(0, 0, 0, 300);
      gradientGreen.addColorStop(0, 'rgba(63, 185, 80, 0.25)');
      gradientGreen.addColorStop(1, 'rgba(63, 185, 80, 0.0)');

      const isMultiDay = currentRange !== '1d';

      if (myChart) {
        myChart.destroy();
        myChart = null;
      }

      const datasets = [
        {
          label: '收盤軌跡',
          data: processed.data,
          borderColor: '#3fb950',
          backgroundColor: gradientGreen,
          fill: !isMultiDay,
          borderWidth: 2,
          pointRadius: 0,
          pointHoverRadius: 0,
          tension: 0.25,
          yAxisID: 'y',
          spanGaps: true,
          segment: {
            borderColor: (ctx) => {
              if (lastHoveredIndex !== -1 && ctx.p1DataIndex > lastHoveredIndex) {
                return 'rgba(63, 185, 80, 0.25)';
              }
              return '#3fb950';
            },
            borderDash: (ctx) => {
              if (lastHoveredIndex !== -1 && ctx.p1DataIndex > lastHoveredIndex) {
                return [3, 3];
              }
              return undefined;
            }
          }
        }
      ];

      if (isMultiDay && processed.maxData.length > 0) {
        datasets.push({
          label: '最高波動',
          data: processed.maxData,
          borderColor: 'rgba(63, 185, 80, 0.3)',
          borderWidth: 1,
          borderDash: [2, 2],
          pointRadius: 0,
          pointHoverRadius: 0,
          tension: 0.25,
          yAxisID: 'y',
          fill: false
        });
        datasets.push({
          label: '最低波動',
          data: processed.minData,
          borderColor: 'rgba(63, 185, 80, 0.3)',
          backgroundColor: 'rgba(63, 185, 80, 0.08)',
          borderWidth: 1,
          borderDash: [2, 2],
          pointRadius: 0,
          pointHoverRadius: 0,
          tension: 0.25,
          yAxisID: 'y',
          fill: '-1'
        });
      }

      myChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: processed.labels,
          datasets: datasets
        },
        options: {
          normalized: true,
          events: [],
          responsive: true,
          maintainAspectRatio: false,
          transitions: {
            active: {
              animation: {
                duration: 0
              }
            }
          },
          animation: animate ? {
            duration: 350,
            easing: 'easeOutQuart'
          } : false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { display: false },
            tooltip: { enabled: false },
            zoom: {
              pan: { enabled: false },
              zoom: { 
                wheel: { enabled: true }, 
                pinch: { enabled: true }, 
                mode: 'x'
              }
            }
          },
          scales: {
            x: { 
              type: 'category',
              ticks: { 
                autoSkip: true,
                maxTicksLimit: 7,
                maxRotation: 0,
                color: '#8b949e', 
                font: { size: 9 },
                callback: function(val, index) {
                  const parsedList = processedDataStore.parsedTimes;
                  if (!parsedList || !parsedList[index]) return "";

                  const curr = parsedList[index];
                  if (index === 0) {
                    return curr.date ? `${curr.date} ${curr.time}` : curr.time;
                  }
                  
                  const prev = parsedList[index - 1];
                  if (prev && curr.date && prev.date && curr.date !== prev.date) {
                    return curr.date;
                  }
                  return curr.time;
                }
              }, 
              grid: { color: 'rgba(255,255,255,0.03)' } 
            },
            y: { 
              position: 'left',
              ticks: { color: '#3fb950', font: { size: 10 } }, 
              grid: { color: 'rgba(255,255,255,0.05)' } 
            }
          }
        }
      });

      setupDirectTouchListeners(canvas);
      updatePricePanel(processed.data);
    }

    function updatePricePanel(arr) {
      if (!arr || arr.length === 0) return;
      const last = arr[arr.length - 1];
      const max = Math.max(...arr);
      const min = Math.min(...arr);

      let unit = '%';
      if (currentTarget === 'oil') unit = ' USD';
      else if (currentTarget === 'metal') unit = 'x';

      const panel = document.getElementById('val-current');
      panel.className = 'price-main ' + (last >= 0 ? 'up' : 'down');
      panel.innerText = (last >= 0 ? '+' : '') + last + unit;

      document.getElementById('val-max').innerText = (max >= 0 ? '+' : '') + max + unit;
      document.getElementById('val-min').innerText = (min >= 0 ? '+' : '') + min + unit;
    }

    function switchTarget(target) {
      currentTarget = target;
      document.querySelectorAll('.asset-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', (idx === 0 && target === 'skhy') || (idx === 1 && target === 'oil') || (idx === 2 && target === 'metal'));
      });
      document.getElementById('chart-title').innerText = getTitle(target);
      renderChart(false, true);
    }

    function switchRange(range) {
      currentRange = range;
      document.querySelectorAll('.range-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', (idx === 0 && range === '1d') || (idx === 1 && range === '5d') || (idx === 2 && range === '1m'));
      });
      renderChart(false, true);
    }

    function switchTimeframe(range) {
      switchRange(range);
    }

    function getTitle(target) {
      if (target === 'skhy') return '📈 SK海力士 折溢價率';
      if (target === 'oil') return '🛢️ 原油 BZ-CL 價差';
      return '🥇 貴金屬 金銀比';
    }

    function resetZoom() {
      if (myChart) {
        myChart.resetZoom();
      }
      renderChart(false, true);
    }

    function startAutoRefresh() {
      if (refreshTimer) clearInterval(refreshTimer);
      refreshTimer = setInterval(() => {
        if (!document.hidden) {
          loadData(true);
        }
      }, 15000);
    }

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        if (refreshTimer) clearInterval(refreshTimer);
      } else {
        loadData(true);
        startAutoRefresh();
      }
    });

    window.onload = () => {
      loadData();
      startAutoRefresh();
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>富途牛牛風格專業版 Telegram Mini App</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Chart.js & Zoom Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #0d1117;
      color: #d1d4dc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      padding: 8px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    /* 頂部標籤與資訊區 */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 6px 8px 6px;
      border-bottom: 1px solid #161b22;
    }
    .symbol-title {
      font-size: 15px;
      font-weight: 700;
      color: #58a6ff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge-status {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #161b22;
      color: #8b949e;
      border: 1px solid #30363d;
    }
    .badge-status.active {
      color: #3fb950;
      border-color: rgba(63, 185, 80, 0.4);
      background: rgba(63, 185, 80, 0.1);
    }
    /* 富途牛牛風格頂部時間區間選單 */
    .range-selector {
      display: flex;
      gap: 4px;
      background: #161b22;
      padding: 3px;
      border-radius: 6px;
      margin: 8px 0;
      border: 1px solid #21262d;
      overflow-x: auto;
      white-space: nowrap;
    }
    .range-btn {
      flex: 1;
      background: transparent;
      color: #8b949e;
      border: none;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      text-align: center;
    }
    .range-btn.active {
      background: #21262d;
      color: #58a6ff;
      box-shadow: inset 0 0 0 1px #30363d;
    }
    /* 富途牛牛標的切換區 */
    .asset-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .asset-btn {
      flex: 1;
      background: #161b22;
      color: #8b949e;
      border: 1px solid #30363d;
      padding: 6px 0;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
    }
    .asset-btn.active {
      background: #238636;
      color: #ffffff;
      border-color: #2ea043;
      box-shadow: 0 0 10px rgba(46, 160, 67, 0.4);
    }
    /* 圖表主卡片 */
    .chart-card {
      flex: 1;
      background: #0d1117;
      border-radius: 8px;
      border: 1px solid #21262d;
      padding: 6px;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .chart-container {
      position: relative;
      flex: 1;
      width: 100%;
    }
    /* 即時數據面板 (富途經典資訊列) */
    .price-panel {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 4px 8px;
      background: #161b22;
      border-radius: 6px;
      margin-bottom: 6px;
      border: 1px solid #21262d;
    }
    .price-main {
      font-size: 18px;
      font-weight: 800;
      font-family: monospace;
    }
    .price-main.up { color: #3fb950; }
    .price-main.down { color: #f85149; }
    .price-sub-info {
      font-size: 11px;
      color: #8b949e;
      display: flex;
      gap: 10px;
    }
    .error-banner {
      display: none;
      background: rgba(248, 81, 73, 0.15);
      border: 1px solid rgba(248, 81, 73, 0.4);
      color: #ff7b72;
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      text-align: center;
      margin-bottom: 8px;
    }
    .loading-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(13, 17, 23, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #58a6ff;
      font-size: 12px;
      font-weight: 600;
      border-radius: 8px;
      z-index: 10;
      transition: opacity 0.3s ease;
    }
    .footer-hint {
      text-align: center;
      font-size: 10px;
      color: #484f58;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="symbol-title" id="chart-title">
      📈 SK海力士 折溢價率 (富途牛牛專業版)
    </div>
    <div class="badge-status" id="live-status">資料同步中...</div>
  </div>

  <div id="error-box" class="error-banner"></div>

  <!-- 標的選擇 -->
  <div class="asset-tabs">
    <button class="asset-btn active" onclick="switchTarget('skhy')">海力士溢價</button>
    <button class="asset-btn" onclick="switchTarget('oil')">原油價差</button>
    <button class="asset-btn" onclick="switchTarget('metal')">金銀比值</button>
  </div>

  <!-- 富途牛牛風格：多日跨度選擇器 -->
  <div class="range-selector">
    <button class="range-btn" onclick="switchRange('1d')">分時 1日</button>
    <button class="range-btn active" onclick="switchRange('5d')">多日 5日</button>
    <button class="range-btn" onclick="switchRange('1m')">全景 1月</button>
    <button class="range-btn" onclick="resetZoom()">🔍 重置縮放</button>
  </div>

  <!-- 即時價格儀表板 -->
  <div class="price-panel">
    <div class="price-main up" id="val-current">--</div>
    <div class="price-sub-info">
      <div>高 <span id="val-max" style="color:#3fb950">--</span></div>
      <div>低 <span id="val-min" style="color:#f85149">--</span></div>
      <div>均線MA <span id="val-ma" style="color:#d29922">--</span></div>
    </div>
  </div>

  <!-- 主圖卡片 (雙 Y 軸 + 成交量/波動度副圖) -->
  <div class="chart-card">
    <div id="loading" class="loading-overlay">正在讀取多日跨度歷史數據...</div>
    <div class="chart-container">
      <canvas id="myChart"></canvas>
    </div>
  </div>

  <div class="footer-hint">💡 支援雙指縮放與左右拖曳 | 富途綠紅配色 & 雙 Y 軸對比</div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
      window.Telegram.WebApp.setHeaderColor('#0d1117');
      window.Telegram.WebApp.setBackgroundColor('#0d1117');
    }

    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTAD_G7gmUBWBOIibkcg-qDZmHaVdYhTW3Ly1e65f-EmYg62A5R4OHZoqyEHb4Cpqr/exec";
    
    let rawSheetData = [];
    let currentTarget = 'skhy';
    let currentRange = '5d';
    let myChart = null;

    async function loadData() {
      const loader = document.getElementById('loading');
      const errorBox = document.getElementById('error-box');
      const badge = document.getElementById('live-status');
      
      loader.style.opacity = '1';
      loader.style.display = 'flex';
      errorBox.style.display = 'none';

      try {
        // 抓取最大筆數以提供多日跨度歷史
        const res = await fetch(APPS_SCRIPT_URL + "?action=getData&limit=3000");
        const json = await res.json();

        if (json && json.status === "success" && json.data && json.data.length > 0) {
          rawSheetData = json.data;
          badge.className = "badge-status active";
          badge.innerText = "✅ 歷史數據 (" + rawSheetData.length + "筆)";
          renderChart();
        } else {
          showError("⚠️ 數據庫尚無資料，請先在 Apps Script 執行歷史寫入。");
        }
      } catch (err) {
        showError("⚠️ 連線失敗: " + err.message);
      } finally {
        loader.style.opacity = '0';
        setTimeout(() => { loader.style.display = 'none'; }, 200);
      }
    }

    function showError(msg) {
      const errorBox = document.getElementById('error-box');
      const badge = document.getElementById('live-status');
      badge.className = "badge-status";
      badge.innerText = "讀取失敗";
      errorBox.innerHTML = msg;
      errorBox.style.display = 'block';
    }

    function calculateMA(dataArr, period = 20) {
      const ma = [];
      for (let i = 0; i < dataArr.length; i++) {
        if (i < period - 1) {
          ma.push(dataArr[i]);
        } else {
          let sum = 0;
          for (let j = 0; j < period; j++) {
            sum += dataArr[i - j];
          }
          ma.push(parseFloat((sum / period).toFixed(2)));
        }
      }
      return ma;
    }

    function processData(target, range) {
      if (!rawSheetData || rawSheetData.length === 0) return { labels: [], data: [], ma: [] };

      let limit = 1440; // 預設 5d / 多日
      let step = 5;

      if (range === '1d') { limit = 300; step = 1; }
      else if (range === '5d') { limit = 1440; step = 6; }
      else if (range === '1m') { limit = 4320; step = 15; }

      const sliced = rawSheetData.slice(-limit);
      const labels = [];
      const data = [];

      for (let i = 0; i < sliced.length; i += step) {
        const item = sliced[i];
        labels.push(item.time); // 已格式化為 MM-dd HH:mm
        
        if (target === 'skhy') data.push(parseFloat(item.skhy));
        else if (target === 'oil') data.push(parseFloat(item.oil));
        else if (target === 'metal') data.push(parseFloat(item.metal));
      }

      const ma = calculateMA(data, 15);
      return { labels, data, ma };
    }

    function renderChart() {
      const ctx = document.getElementById('myChart').getContext('2d');
      const processed = processData(currentTarget, currentRange);

      if (processed.data.length === 0) return;

      // 建立富途牛牛風格半透明綠色區域 Fill
      const gradientGreen = ctx.createLinearGradient(0, 0, 0, 300);
      gradientGreen.addColorStop(0, 'rgba(63, 185, 80, 0.25)');
      gradientGreen.addColorStop(1, 'rgba(63, 185, 80, 0.0)');

      if (!myChart) {
        myChart = new Chart(ctx, {
          type: 'line',
          data: {
            labels: processed.labels,
            datasets: [
              {
                label: '走勢軌跡',
                data: processed.data,
                borderColor: '#3fb950',          // 富途牛牛經典螢光綠
                backgroundColor: gradientGreen,
                fill: true,
                borderWidth: 2,
                pointRadius: 0,
                pointHoverRadius: 6,
                pointHoverBackgroundColor: '#3fb950',
                pointHoverBorderColor: '#ffffff',
                pointHoverBorderWidth: 2,
                tension: 0.25,
                yAxisID: 'y'
              },
              {
                label: '均線 (MA15)',
                data: processed.ma,
                borderColor: '#d29922',          // 富途牛牛經典均線橘黃色
                borderWidth: 1.5,
                pointRadius: 0,
                fill: false,
                tension: 0.3,
                yAxisID: 'y'
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
              legend: { display: false },
              tooltip: {
                enabled: true,
                backgroundColor: '#161b22',
                titleColor: '#58a6ff',
                bodyColor: '#e6edf3',
                borderColor: '#30363d',
                borderWidth: 1,
                padding: 10,
                displayColors: true
              },
              zoom: {
                pan: { enabled: true, mode: 'x' },
                zoom: { wheel: { enabled: true }, pinch: { enabled: true }, mode: 'x' }
              }
            },
            scales: {
              x: { 
                type: 'category',
                ticks: { 
                  autoSkip: true,
                  maxTicksLimit: 7,               // 均勻顯示 7 個多日日期標籤 (例: 07-21, 07-23, 07-25...)
                  maxRotation: 0,
                  color: '#8b949e', 
                  font: { size: 9 }
                }, 
                grid: { color: 'rgba(255,255,255,0.03)' } 
              },
              y: { 
                position: 'left',
                ticks: { color: '#3fb950', font: { size: 10 } }, 
                grid: { color: 'rgba(255,255,255,0.05)' } 
              }
            }
          }
        });
      } else {
        myChart.data.labels = processed.labels;
        myChart.data.datasets[0].data = processed.data;
        myChart.data.datasets[1].data = processed.ma;
        myChart.resetZoom();
        myChart.update();
      }

      updatePricePanel(processed.data, processed.ma);
    }

    function updatePricePanel(arr, maArr) {
      if (!arr || arr.length === 0) return;
      const last = arr[arr.length - 1];
      const max = Math.max(...arr);
      const min = Math.min(...arr);
      const lastMa = maArr[maArr.length - 1] || '--';

      let unit = '%';
      if (currentTarget === 'oil') unit = ' USD';
      else if (currentTarget === 'metal') unit = 'x';

      const panel = document.getElementById('val-current');
      panel.className = 'price-main ' + (last >= 0 ? 'up' : 'down');
      panel.innerText = (last >= 0 ? '+' : '') + last + unit;

      document.getElementById('val-max').innerText = (max >= 0 ? '+' : '') + max + unit;
      document.getElementById('val-min').innerText = (min >= 0 ? '+' : '') + min + unit;
      document.getElementById('val-ma').innerText = lastMa + unit;
    }

    function switchTarget(target) {
      currentTarget = target;
      document.querySelectorAll('.asset-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', (idx === 0 && target === 'skhy') || (idx === 1 && target === 'oil') || (idx === 2 && target === 'metal'));
      });
      document.getElementById('chart-title').innerText = getTitle(target);
      renderChart();
    }

    function switchRange(range) {
      currentRange = range;
      document.querySelectorAll('.range-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', (idx === 0 && range === '1d') || (idx === 1 && range === '5d') || (idx === 2 && range === '1m'));
      });
      renderChart();
    }

    function getTitle(target) {
      if (target === 'skhy') return '📈 SK海力士 折溢價率 (富途專業版)';
      if (target === 'oil') return '🛢️ 原油 BZ-CL 價差 (富途專業版)';
      return '🥇 貴金屬 金銀比 (富途專業版)';
    }

    function resetZoom() {
      if (myChart) myChart.resetZoom();
    }

    window.onload = () => {
      loadData();
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>量化資產 Telegram Mini App</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Chart.js & Zoom Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 12px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .title {
      font-size: 16px;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }
    .tab-btn {
      flex: 1;
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 8px 0;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: #38bdf8;
      color: #0f172a;
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }
    .tf-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      background: #1e293b;
      padding: 4px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .tf-btn {
      flex: 1;
      background: transparent;
      color: #94a3b8;
      border: none;
      padding: 6px 0;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
    }
    .tf-btn.active {
      background: #334155;
      color: #f8fafc;
    }
    .chart-card {
      flex: 1;
      background: #1e293b;
      border-radius: 12px;
      border: 1px solid #334155;
      padding: 10px;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .chart-container {
      position: relative;
      flex: 1;
      width: 100%;
    }
    .stat-row {
      display: flex;
      justify-content: space-around;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #334155;
      font-size: 12px;
    }
    .stat-item {
      text-align: center;
    }
    .stat-label {
      color: #64748b;
      font-size: 10px;
      margin-bottom: 2px;
    }
    .stat-val {
      font-weight: 700;
      color: #f8fafc;
    }
    .hint {
      text-align: center;
      font-size: 10px;
      color: #64748b;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="title">
      ⚡ 量化監控 Mini App
    </div>
    <div class="badge" id="live-time">更新中...</div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTarget('skhy')">海力士溢價</button>
    <button class="tab-btn" onclick="switchTarget('oil')">原油價差</button>
    <button class="tab-btn" onclick="switchTarget('metal')">金銀比值</button>
  </div>

  <div class="tf-row">
    <button class="tf-btn active" onclick="switchTimeframe('1m')">1M 即時</button>
    <button class="tf-btn" onclick="switchTimeframe('5m')">5M 趨勢</button>
    <button class="tf-btn" onclick="switchTimeframe('1h')">1H K線</button>
    <button class="tf-btn" onclick="resetZoom()">🔍 重置縮放</button>
  </div>

  <div class="chart-card">
    <div class="chart-container">
      <canvas id="myChart"></canvas>
    </div>

    <div class="stat-row">
      <div class="stat-item">
        <div class="stat-label">當前指標數值</div>
        <div class="stat-val" id="val-current">--</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">商品 A 價格</div>
        <div class="stat-val" id="val-priceA">--</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">商品 B 價格</div>
        <div class="stat-val" id="val-priceB">--</div>
      </div>
    </div>
  </div>

  <div class="hint">💡 支援雙指放大/縮放圖表與左右平移，點擊頂部切換標的與時間</div>

  <script>
    // 初始化 Telegram WebApp
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
      window.Telegram.WebApp.setHeaderColor('#0f172a');
      window.Telegram.WebApp.setBackgroundColor('#0f172a');
    }

    const WORKER_URL = "https://polished-paper-a7b8.lou2739994.workers.dev/?symbol=";
    let currentTarget = 'skhy';
    let currentTimeframe = '1m';
    let myChart = null;

    // 模擬與歷史資料生成器
    function generateData(target, tf) {
      const count = tf === '1m' ? 30 : (tf === '5m' ? 60 : 120);
      const labels = [];
      const data = [];
      const now = new Date();
      
      let baseVal = target === 'skhy' ? 35.2 : (target === 'oil' ? 3.24 : 69.5);
      let volatility = target === 'skhy' ? 0.3 : (target === 'oil' ? 0.1 : 0.2);

      for (let i = count; i >= 0; i--) {
        const d = new Date(now.getTime() - i * (tf === '1m' ? 60000 : (tf === '5m' ? 300000 : 3600000)));
        const timeStr = tf === '1h' 
          ? (d.getMonth()+1) + '-' + d.getDate() + ' ' + String(d.getHours()).padStart(2,'0') + ':00'
          : String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
        
        labels.push(timeStr);
        baseVal += (Math.random() - 0.48) * volatility;
        data.push(parseFloat(baseVal.toFixed(2)));
      }

      return { labels, data };
    }

    function initChart() {
      const ctx = document.getElementById('myChart').getContext('2d');
      const dataObj = generateData(currentTarget, currentTimeframe);

      myChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: dataObj.labels,
          datasets: [{
            label: getTitle(currentTarget),
            data: dataObj.data,
            borderColor: '#38bdf8',
            backgroundColor: 'rgba(56, 189, 248, 0.12)',
            fill: true,
            borderWidth: 2.5,
            pointRadius: 2,
            tension: 0.25
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            zoom: {
              pan: { enabled: true, mode: 'x' },
              zoom: { wheel: { enabled: true }, pinch: { enabled: true }, mode: 'x' }
            }
          },
          scales: {
            x: {
              ticks: { color: '#64748b', font: { size: 10 } },
              grid: { color: 'rgba(255,255,255,0.05)' }
            },
            y: {
              ticks: { color: '#94a3af', font: { size: 10 } },
              grid: { color: 'rgba(255,255,255,0.08)' }
            }
          }
        }
      });
      updateStats();
    }

    function getTitle(target) {
      if (target === 'skhy') return 'SK海力士 溢價率 (%)';
      if (target === 'oil') return '原油 BZ-CL 價差 (USD)';
      return '貴金屬 金銀比 (XAU/XAG)';
    }

    function switchTarget(target) {
      currentTarget = target;
      document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', (idx === 0 && target === 'skhy') || (idx === 1 && target === 'oil') || (idx === 2 && target === 'metal'));
      });
      updateChart();
    }

    function switchTimeframe(tf) {
      currentTimeframe = tf;
      document.querySelectorAll('.tf-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', (idx === 0 && tf === '1m') || (idx === 1 && tf === '5m') || (idx === 2 && tf === '1h'));
      });
      updateChart();
    }

    function updateChart() {
      if (!myChart) return;
      const dataObj = generateData(currentTarget, currentTimeframe);
      myChart.data.labels = dataObj.labels;
      myChart.data.datasets[0].label = getTitle(currentTarget);
      myChart.data.datasets[0].data = dataObj.data;
      myChart.resetZoom();
      myChart.update();
      updateStats();
    }

    function resetZoom() {
      if (myChart) myChart.resetZoom();
    }

    async function updateStats() {
      const now = new Date();
      document.getElementById('live-time').innerText = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');

      let symA = 'SKHYUSDT', symB = 'SKHYNIXUSDT';
      if (currentTarget === 'oil') { symA = 'BZUSDT'; symB = 'CLUSDT'; }
      if (currentTarget === 'metal') { symA = 'XAUUSDT'; symB = 'XAGUSDT'; }

      try {
        const [resA, resB] = await Promise.all([
          fetch(WORKER_URL + symA).then(r => r.json()),
          fetch(WORKER_URL + symB).then(r => r.json())
        ]);

        const pA = parseFloat(resA.price);
        const pB = parseFloat(resB.price);

        document.getElementById('val-priceA').innerText = '$' + pA;
        document.getElementById('val-priceB').innerText = '$' + pB;

        let calcVal = 0;
        let unit = '%';
        if (currentTarget === 'skhy') {
          calcVal = (((pA / 0.1) / pB - 1) * 100).toFixed(2);
          unit = '%';
        } else if (currentTarget === 'oil') {
          calcVal = (pA - pB).toFixed(2);
          unit = ' USD';
        } else {
          calcVal = (pA / pB).toFixed(2);
          unit = 'x';
        }

        document.getElementById('val-current').innerText = (calcVal >= 0 ? '+' : '') + calcVal + unit;
      } catch (e) {
        document.getElementById('val-current').innerText = '即時連線中...';
      }
    }

    window.onload = () => {
      initChart();
      setInterval(updateStats, 5000);
    };
  </script>
</body>
</html>
